<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="css/common.css">


</head>

<body>
<div class="cursor-glow"></div>

<!-- 顶部导航 -->

<div class="nav-wrap">

  <nav class="nav">

    <ul>
      <li><a href="index.html">入长安</a></li>
      <li><a href="heritage.html">观非遗</a></li>
      <li><a href="workshop.html">沉浸研习</a></li>
      <li><a href="tangshu.html">唐姝同行</a></li>
      <li><a href="creation.html">百工新生</a></li>
      <li><a class="active" href="login.html">登录</a></li>
    </ul>

  </nav>

</div>

<!-- 主体 -->

<main>

<section class="hero">

  <div class="hero-light"></div>

  <div class="login-shell">

    <div class="small">
      FUTURE CHANG'AN PORTAL
    </div>

    <h2 class="title">
      进入未来长安平台
    </h2>

    <p class="text">
      登录后，你将进入由唐姝陪伴的未来东方空间，
      继续观看、研习与创造。
    </p>

    <form class="login-form">

      <div>

        <label class="small">
          账号
        </label>

        <input
          class="future-input"
          type="text"
          placeholder="请输入邮箱或手机号"
        >

      </div>

      <div>

        <label class="small">
          密码
        </label>

        <input
          class="future-input"
          type="password"
          placeholder="请输入密码"
        >

      </div>

      <button
        type="submit"
        class="live-btn"
      >
        登录平台
      </button>

      <a href="#" class="forgot-link small">
        忘记密码？
      </a>

    </form>

  </div>

</section>

</main>

<script src="js/common.js"></script>
</body>
</html>
