<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>登录 · 入长安平台</title>
<link rel="stylesheet" href="css/denglu.css">
</head>

<body class="page-login">

<nav class="nav">
  <ul>
    <li><a href="index.html">首页</a></li>
    <li><a href="heritage.html">观非遗</a></li>
    <li><a href="workshop.html">沉浸研习</a></li>
    <li><a href="tangshu.html">唐姝同行</a></li>
    <li><a class="active" href="login.html">登录</a></li>
  </ul>
</nav>

<main>
<section class="hero fade" style="padding-top:180px; padding-bottom:140px;">
  
  <div class="hero-light"></div>

  <div class="login-shell" 
       style="
       width: min(92%, 480px);
       margin: 0 auto;
       padding: 48px 42px;
       border-radius: 34px;
       background: rgba(255,255,255,.035);
       border: 1px solid rgba(198,168,106,.12);
       backdrop-filter: blur(18px);
       box-shadow: 0 30px 80px rgba(0,0,0,.28);
       display: grid;
       gap: 32px;
       text-align: left;
       ">

    <div class="small">Welcome Back</div>
    <h2 class="title" style="margin-bottom:10px;">进入未来长安平台</h2>
    <p class="text" style="max-width:100%;">
      登录后，你将进入由唐姝陪伴的未来东方空间，继续观看、研习与创造。
    </p>

    <form class="login-form" style="display:grid; gap:24px; margin-top:12px;">
      
      <div>
        <label class="small" style="letter-spacing:.18em;">账号</label>
        <input type="text" placeholder="请输入邮箱或手机号"
               style="
               width:100%;
               margin-top:10px;
               padding:16px 18px;
               border-radius:18px;
               border:1px solid rgba(198,168,106,.22);
               background:rgba(255,255,255,.04);
               color:#fff;
               font-size:16px;
               outline:none;
               ">
      </div>

      <div>
        <label class="small" style="letter-spacing:.18em;">密码</label>
        <input type="password" placeholder="请输入密码"
               style="
               width:100%;
               margin-top:10px;
               padding:16px 18px;
               border-radius:18px;
               border:1px solid rgba(198,168,106,.22);
               background:rgba(255,255,255,.04);
               color:#fff;
               font-size:16px;
               outline:none;
               ">
      </div>

      <button type="submit" class="enter" 
              style="width:100%; justify-content:center; margin-top:10px;">
        登录平台
      </button>

      <a href="#" class="small" 
         style="text-align:center; margin-top:6px; opacity:.75;">
        忘记密码？
      </a>

    </form>

  </div>

</section>
</main>

</body>
</html>
